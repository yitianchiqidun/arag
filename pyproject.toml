[project]
name = "arag"
version = "0.1.0"
description = "ARAG - Agentic Retrieval-Augmented Generation Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ayanami0730", email = "ayanami0730@gmail.com"}
]
keywords = ["rag", "llm", "retrieval", "agent", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=2.2.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# research_agent: extensions built on top of A-RAG (see docs/upstream_changes.md)
research = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "torch>=2.4",
    "types-PyYAML",
    "types-requests",
]
# Stage 2 trajectory viewer (apps/trace_viewer.py); kept out of `research` for lean services.
viewer = [
    "streamlit>=1.40",
]
# Stage 6 main agent (research_agent/assistant): LangGraph pinned (PLAN: a fixed version).
agent = [
    "langgraph==1.2.19",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-sqlite==3.1.3",
]
# Stage 5 TiDB tools (research_agent/tidb): MySQL protocol client.
tidb = [
    "pymysql>=1.1",
    "types-PyMySQL",
]
service = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Ayanami0730/arag"
Repository = "https://github.com/Ayanami0730/arag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arag", "research_agent"]

# Local driver (Windows 572.70) supports CUDA <= 12.8; default PyPI torch targets newer CUDA.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.sdist]
include = ["src/arag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Upstream A-RAG ships without type information (no py.typed).
module = ["arag", "arag.*"]
follow_untyped_imports = true
