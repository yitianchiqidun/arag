# The TiDB operations assistant (stage 6, docs/architecture.md).
run_config: configs/tidb_docs_qwen37_plus.yaml  # A-RAG over the TiDB docs index

router:  # follow-up rewriting and intent classification: small and fast
  model: qwen3.7-flash-2026-07-15
  temperature: 0.0
  max_tokens: 300
  enable_thinking: false

agent:  # the diagnosis loop (tools, write proposals)
  model: qwen3.7-plus-2026-05-26
  temperature: 0.0
  max_tokens: 4096
  enable_thinking: false

use_cluster: true  # the local tiup playground; tools report "集群不可用" when it is down
checkpoint_db: data/assistant/sessions.sqlite
trace_dir: data/assistant/traces
audit_file: data/assistant/writes.jsonl
max_steps: 12
